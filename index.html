<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for kesha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * {
    margin:0;
    padding:0;
    box-sizing:border-box;
  }
  html, body {
    height:100%;
  }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
    background:radial-gradient(ellipse 90% 70% at 50% 62%, #1b3090 0%, #0f1a55 38%, #070b2c 72%, #04061a 100%);
    font-family:'Cormorant Garamond', Georgia, serif;
    -webkit-tap-highlight-color:transparent;
  }

  .sky {
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .s {
    position:absolute;
    border-radius:50%;
    background:#fff;
    opacity:.2;
    animation:twinkle var(--t) ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:.12; transform:scale(.8);} 50%{opacity:.95; transform:scale(1.25);} }
  .bk { position:absolute; bottom:-18%; border-radius:50%; opacity:.5;
        background:radial-gradient(circle at 35% 35%, rgba(200,225,255,.38), rgba(120,170,255,.10) 58%, transparent 70%);
        animation:rise var(--t) linear infinite; }
  @keyframes rise { from{ transform:translateY(0); } to{ transform:translateY(-135vh); } }
  .vignette {
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,10,.6) 100%);
  }

  .scene {
    position:relative;
    width:100vmin;
    height:100vmin;
    max-width:900px;
    max-height:900px;
    z-index:2;
  }
  .aura { position:absolute; left:50%; top:50%; width:115%; aspect-ratio:1; transform:translate(-50%,-50%); z-index:3; pointer-events:none; opacity:0;
          background:radial-gradient(circle, rgba(120,170,255,.40) 0%, rgba(80,120,240,.16) 40%, transparent 68%); }
  .opening .aura {
    animation:auraIn 2.2s 1.1s ease-out both;
  }
  @keyframes auraIn { from{opacity:0;} to{opacity:1;} }

  .gift {
    position:absolute;
    inset:0;
    cursor:pointer;
    z-index:5;
    transition:opacity .4s ease 1.4s;
    outline:none;
  }
  .gift:focus-visible {
    outline:2px solid rgba(190,220,255,.9);
    outline-offset:-10px;
    border-radius:28px;
  }
  .opening .gift {
    opacity:0;
    pointer-events:none;
  }
  .gift-svg {
    width:100%;
    height:100%;
    overflow:visible;
    transform-origin:400px 590px;
    animation:giftBob 3.2s ease-in-out infinite;
    filter:drop-shadow(0 0 36px rgba(110,170,255,.45));
  }
  @keyframes giftBob { 0%,100%{transform:translateY(0) rotate(-.5deg);} 50%{transform:translateY(-10px) rotate(.5deg);} }
  .opening .gift-svg {
    animation:giftShake .45s ease;
  }
  @keyframes giftShake { 0%,100%{transform:translate(0,0) rotate(0);} 15%{transform:translate(-8px,-3px) rotate(-3deg);} 30%{transform:translate(8px,2px) rotate(3deg);} 45%{transform:translate(-6px,-2px) rotate(-2deg);} 60%{transform:translate(6px,1px) rotate(2deg);} 80%{transform:translate(-3px,0) rotate(-1deg);} }
  .opening .lid {
    animation:lidFly 1.3s .35s cubic-bezier(.3,.6,.4,1) forwards;
    transform-origin:400px 500px;
  }
  @keyframes lidFly { 0%{transform:translate(0,0) rotate(0);opacity:1;} 20%{transform:translate(0,-30px) rotate(-8deg);opacity:1;} 60%{transform:translate(-80px,-180px) rotate(-40deg);opacity:1;} 100%{transform:translate(-220px,-500px) rotate(-90deg);opacity:0;} }
  .opening .body-group {
    animation:boxDrop .9s .7s cubic-bezier(.5,.1,.9,.3) forwards;
    transform-origin:400px 590px;
  }
  @keyframes boxDrop { 0%{transform:translateY(0) scale(1);opacity:1;} 40%{transform:translateY(30px) scale(.98);opacity:.8;} 100%{transform:translateY(200px) scale(.7);opacity:0;} }
  .pulse-hint, .sparkle-hint {
    transition:opacity .3s;
  }
  .opening .pulse-hint, .opening .sparkle-hint {
    opacity:0;
  }
  .hint {
    position:absolute;
    left:0;
    right:0;
    bottom:7%;
    text-align:center;
    font-style:italic;
    font-size:clamp(20px,3.4vmin,30px);
    color:rgba(205,226,255,.85);
    letter-spacing:.04em;
    animation:hintPulse 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes hintPulse { 0%,100%{opacity:.45;} 50%{opacity:1;} }
  .opening .hint {
    animation:none;
    opacity:0;
    transition:opacity .3s;
  }
  .burst {
    position:absolute;
    left:50%;
    top:65%;
    width:60%;
    aspect-ratio:1;
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    background:radial-gradient(circle,rgba(230,244,255,1) 0%,rgba(160,210,255,.8) 20%,rgba(120,190,255,.4) 45%,transparent 75%);
    opacity:0;
    pointer-events:none;
    z-index:6;
  }
  .opening .burst {
    animation:burstOut 1.2s .4s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes burstOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0);} 25%{opacity:1;transform:translate(-50%,-50%) scale(.7);} 100%{opacity:0;transform:translate(-50%,-50%) scale(2.8);} }

  .bouquet-scene {
    position:absolute;
    inset:0;
    opacity:0;
    z-index:4;
    pointer-events:none;
  }
  .opening .bouquet-scene {
    animation:showScene .5s .8s ease forwards;
  }
  @keyframes showScene { to{opacity:1;} }
  .bouquet { width:100%; height:100%; overflow:visible; transform-origin:center 80%;
             filter:drop-shadow(0 18px 26px rgba(0,0,30,.55)) drop-shadow(0 0 38px rgba(90,150,255,.28)); }
  .opening .bouquet {
    animation:riseUp 1.3s 1s cubic-bezier(.2,.9,.3,1.12) both, sway 8s 2.4s ease-in-out infinite;
  }
  @keyframes riseUp { 0%{transform:translateY(100vh) scale(.3);opacity:0;} 60%{transform:translateY(-30px) scale(1.06);opacity:1;} 80%{transform:translateY(12px) scale(.98);} 100%{transform:translateY(0) scale(1);opacity:1;} }
  @keyframes sway { 0%,100%{ rotate:-1.5deg; translate:0 0; } 50%{ rotate:1.5deg; translate:0 -6px; } }

  .boom {
    opacity:0;
    transform-origin:400px 640px;
  }
  .opening .boom {
    animation:boomOut 1s 2.1s cubic-bezier(.1,.7,.3,1) both;
  }
  @keyframes boomOut { 0%{transform:scale(0);opacity:.9;} 65%{opacity:.4;} 100%{transform:scale(5);opacity:0;} }
  .rays {
    opacity:0;
    transform-origin:400px 640px;
  }
  .opening .rays {
    animation:raysOut .9s 2.1s cubic-bezier(.1,.8,.3,1) both;
  }
  @keyframes raysOut { 0%{transform:scale(.2) rotate(0);opacity:.9;} 100%{transform:scale(2.4) rotate(18deg);opacity:0;} }

  .fl {
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  .opening .fl {
    animation:popIn .85s cubic-bezier(.2,1.3,.4,1) var(--d) both;
  }
  @keyframes popIn { 0%{transform:scale(.15) rotate(-30deg);opacity:0;} 65%{transform:scale(1.07) rotate(3deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }
  .br {
    transform-box:fill-box;
    transform-origin:center;
    animation:breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{ scale:1; } 50%{ scale:1.03; } }

  .spark {
    transform-box:fill-box;
    transform-origin:center;
    animation:floatSpark 6s ease-in-out infinite;
    opacity:0;
  }
  @keyframes floatSpark { 0%,100%{opacity:0;transform:translateY(0) scale(.5);} 25%{opacity:1;transform:translateY(-12px) scale(1.15);} 60%{opacity:.7;transform:translateY(-24px) scale(1);} 90%{opacity:0;transform:translateY(-38px) scale(.6);} }
  .firefly {
    transform-box:fill-box;
    transform-origin:center;
    animation:fly 9s ease-in-out infinite;
    opacity:0;
  }
  @keyframes fly { 0%{opacity:0;transform:translate(0,0);} 15%{opacity:1;} 40%{transform:translate(40px,-30px);opacity:.9;} 70%{transform:translate(-25px,-60px);opacity:.7;} 90%{opacity:0;transform:translate(15px,-90px);} 100%{opacity:0;transform:translate(15px,-90px);} }
  .butterfly {
    transform-box:fill-box;
    transform-origin:center;
    opacity:0;
    animation:flit 14s ease-in-out infinite;
  }
  @keyframes flit { 0%,100%{opacity:0;transform:translate(0,0) scale(1);} 10%{opacity:1;} 30%{transform:translate(60px,-40px) scale(1.05);opacity:1;} 50%{transform:translate(120px,-20px) scale(1);opacity:.9;} 70%{transform:translate(180px,-70px) scale(1.05);opacity:.8;} 90%{opacity:0;} }
  .wingL, .wingR {
    transform-box:fill-box;
    animation:flap .38s ease-in-out infinite alternate;
  }
  .wingL {
    transform-origin:right center;
  }
  .wingR {
    transform-origin:left center;
  }
  @keyframes flap { 0%{transform:scaleX(1);} 100%{transform:scaleX(.5);} }
  .petalFall {
    opacity:0;
    animation:fall 11s linear infinite;
  }
  @keyframes fall { 0%{opacity:0;transform:translate(0,-40px) rotate(0);} 8%{opacity:.9;} 100%{opacity:0;transform:translate(-60px,720px) rotate(320deg);} }

  .name { position:absolute; left:0; right:0; top:4%; text-align:center; font-family:'Great Vibes', cursive; font-size:clamp(60px,12.5vmin,120px); line-height:1.1;
          color:transparent; background:linear-gradient(180deg,#ffffff 25%,#b9d6ff 100%); -webkit-background-clip:text; background-clip:text;
          filter:drop-shadow(0 0 16px rgba(110,170,255,.6)); opacity:0; pointer-events:none; }
  .opening .name {
    animation:nameIn 2.2s ease-out 3.3s forwards;
  }
  @keyframes nameIn { 0%{opacity:0;transform:translateY(18px) scale(.94);} 100%{opacity:1;transform:translateY(0) scale(1);} }
  .message { position:absolute; left:0; right:0; bottom:4%; text-align:center; font-style:italic; font-weight:500; font-size:clamp(28px,5vmin,50px); letter-spacing:.05em; color:#d3e5ff;
             text-shadow:0 0 14px rgba(120,180,255,.7), 0 2px 10px rgba(0,0,30,.6); opacity:0; pointer-events:none; }
  .opening .message {
    animation:msgIn 2s ease-out 5s forwards;
  }
  @keyframes msgIn { 0%{opacity:0;transform:translateY(14px);} 100%{opacity:1;transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration:.01s !important;
      animation-delay:0s !important;
      animation-iteration-count:1 !important;
    }
    .bouquet-scene, .name, .message, .fl, .aura {
      opacity:1 !important;
    }
    .gift {
      display:none !important;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>
<div class="vignette"></div>

<div class="scene" id="scene">
  <div class="aura"></div>
  <div class="burst"></div>

  <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">
    <svg class="gift-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a56dc"/><stop offset=".6" stop-color="#23379f"/><stop offset="1" stop-color="#141f66"/>
        </linearGradient>
        <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".14" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".86" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
        </linearGradient>
        <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6683f7"/><stop offset="1" stop-color="#2c43bd"/>
        </linearGradient>
        <linearGradient id="gSatin" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8fb6f8"/><stop offset=".3" stop-color="#f4f9ff"/><stop offset=".55" stop-color="#ffffff"/><stop offset=".78" stop-color="#d6e6ff"/><stop offset="1" stop-color="#7fa6ee"/>
        </linearGradient>
        <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0bf"/><stop offset=".5" stop-color="#f6c64a"/><stop offset="1" stop-color="#b8820a"/>
        </linearGradient>
        <radialGradient id="gHalo" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#7fb2ff" stop-opacity=".38"/><stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="gBlur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <ellipse cx="400" cy="590" rx="270" ry="240" fill="url(#gHalo)"/>
      <ellipse cx="400" cy="704" rx="150" ry="15" fill="rgba(0,0,0,.6)" filter="url(#gBlur)"/>
      <g class="body-group">
        <rect x="304" y="520" width="192" height="172" rx="8" fill="url(#gBody)"/>
        <rect x="304" y="520" width="192" height="172" rx="8" fill="url(#gEdge)"/>
        <rect x="304" y="520" width="192" height="172" rx="8" fill="none" stroke="rgba(150,180,255,.35)" stroke-width="1.5"/>
        <rect x="304" y="520" width="192" height="12" fill="rgba(0,0,20,.28)"/>
        <rect x="386" y="520" width="28" height="172" fill="url(#gSatin)"/>
        <rect x="386" y="520" width="28" height="172" fill="none" stroke="rgba(120,160,240,.55)" stroke-width=".8"/>
      </g>
      <g class="lid">
        <rect x="288" y="472" width="224" height="58" rx="9" fill="url(#gLid)"/>
        <rect x="288" y="472" width="224" height="58" rx="9" fill="none" stroke="rgba(190,210,255,.45)" stroke-width="1.5"/>
        <rect x="296" y="476" width="208" height="7" rx="3.5" fill="rgba(255,255,255,.28)"/>
        <rect x="386" y="472" width="28" height="58" fill="url(#gSatin)"/>
        <rect x="386" y="472" width="28" height="58" fill="none" stroke="rgba(120,160,240,.55)" stroke-width=".8"/>
        <g transform="translate(400,470)">
          <path d="M0 0C-30-30-78-36-84-12C-88 8-60 16-32 11C-16 8-5 3 0 0Z" fill="url(#gSatin)" stroke="rgba(110,150,235,.7)" stroke-width="1"/>
          <path d="M-6-2C-32-24-66-26-70-10C-72 2-54 7-33 5" fill="none" stroke="rgba(90,130,225,.55)" stroke-width="1.6"/>
          <path d="M0 0C30-30 78-36 84-12C88 8 60 16 32 11C16 8 5 3 0 0Z" fill="url(#gSatin)" stroke="rgba(110,150,235,.7)" stroke-width="1"/>
          <path d="M6-2C32-24 66-26 70-10C72 2 54 7 33 5" fill="none" stroke="rgba(90,130,225,.55)" stroke-width="1.6"/>
          <path d="M-8 6C-24 24-34 40-27 46C-22 49-14 42-9 31C-5 22-4 12-4 6Z" fill="url(#gSatin)" stroke="rgba(110,150,235,.6)" stroke-width=".8"/>

      </g>
      <g class="sparkle-hint">
        <circle cx="270" cy="470" r="2.2" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="530" cy="500" r="2.6" fill="#a8d0ff"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
        <circle cx="285" cy="650" r="2.2" fill="#fff"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="520" cy="660" r="2.2" fill="#d6ecff"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>

      <g class="pulse-hint">
        <circle cx="400" cy="590" r="180" fill="none" stroke="rgba(180,220,255,.5)" stroke-width="2">
          <animate attributeName="r" values="170;290;170" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0;0.55" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="400" cy="590" r="180" fill="none" stroke="rgba(180,220,255,.3)" stroke-width="1.5">
          <animate attributeName="r" values="170;330;170" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0;0.3" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </svg>
  </div>
  <div class="hint">tap to open</div>

  <div class="bouquet-scene">
    <div class="name">for Kesha</div>
    <div class="message">🫶🫶</div>
    <svg class="bouquet" viewBox="-40 -20 880 880" xmlns="http://www.w3.org/2000/svg">
      <defs id="paldefs"></defs>
      <defs>
        <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c4d9ff"/><stop offset="1" stop-color="#5373cc"/>
        </linearGradient>
        <linearGradient id="paperL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6faff"/><stop offset=".55" stop-color="#c3d8fb"/><stop offset="1" stop-color="#8aa9ec"/>
        </linearGradient>
        <linearGradient id="paperR" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dfebff"/><stop offset=".55" stop-color="#9ab7f1"/><stop offset="1" stop-color="#5f82dc"/>
        </linearGradient>
        <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a9ccff"/><stop offset=".45" stop-color="#eaf3ff"/><stop offset="1" stop-color="#2d58cc"/>
        </linearGradient>
        <linearGradient id="knotG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0bf"/><stop offset=".5" stop-color="#f6c64a"/><stop offset="1" stop-color="#b8820a"/>
        </linearGradient>
        <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#cfe4ff" stop-opacity=".55"/><stop offset="1" stop-color="#8fbaff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e8f4ff" stop-opacity=".95"/><stop offset="1" stop-color="#6fa8ff" stop-opacity=".8"/>
        </linearGradient>
      </defs>

      <g class="boom">
        <circle cx="400" cy="640" r="120" fill="none" stroke="rgba(120,190,255,.6)" stroke-width="4"/>
        <circle cx="400" cy="640" r="80" fill="none" stroke="rgba(180,220,255,.4)" stroke-width="2"/>

      <g id="flowers"></g>

      <path d="M538 516Q468 520 396 554" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
      <path d="M330 540L372 744M352 548L384 746M470 540L428 744M448 548L416 746" stroke="rgba(70,100,190,.18)" stroke-width="1.2" fill="none"/>

      <path d="M306 612Q400 634 494 612L490 636Q400 658 310 636Z" fill="url(#ribbonG)" stroke="rgba(40,80,190,.5)" stroke-width="1"/>
      <path d="M396 636C378 676 362 712 346 752L374 746C386 718 396 682 404 642Z" fill="url(#ribbonG)" stroke="rgba(40,80,190,.5)" stroke-width="1"/>
      <path d="M404 636C422 676 438 712 454 752L426 746C414 718 404 682 396 642Z" fill="url(#ribbonG)" stroke="rgba(40,80,190,.5)" stroke-width="1"/>
      <path d="M400 634C350 598 304 606 316 642C326 668 372 654 400 634Z" fill="url(#ribbonG)" stroke="rgba(40,80,190,.55)" stroke-width="1"/>
      <path d="M400 634C450 598 496 606 484 642C474 668 428 654 400 634Z" fill="url(#ribbonG)" stroke="rgba(40,80,190,.55)" stroke-width="1"/>
      <path d="M392 632C356 608 326 614 332 636" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/>
      <path d="M408 632C444 608 474 614 468 636" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="400" cy="635" rx="16" ry="13" fill="url(#knotG)" stroke="rgba(255,255,255,.7)" stroke-width="1"/>
      <ellipse cx="395" cy="630" rx="5" ry="3.5" fill="rgba(255,255,255,.85)"/>

      <g id="sparks"></g>
      <g id="flies"></g>

      <g class="butterfly" style="animation-delay:2s" transform="translate(220,320)">
        <g class="wingL"><path d="M0 0C-8-20-30-26-26-6C-24 6-10 8 0 0Z M0 2C-4 12-16 22-9 9C-6 4-2 3 0 2Z" fill="url(#wingG)" stroke="#9cc4ff" stroke-width=".8"/></g>
        <g class="wingR"><path d="M0 0C8-20 30-26 26-6C24 6 10 8 0 0Z M0 2C4 12 16 22 9 9C6 4 2 3 0 2Z" fill="url(#wingG)" stroke="#9cc4ff" stroke-width=".8"/></g>
        <ellipse cx="0" cy="1" rx="1.8" ry="9" fill="#e8f4ff"/>
      </g>
      <g class="butterfly" style="animation-delay:7s" transform="translate(560,300)">
        <g class="wingL"><path d="M0 0C-8-20-30-26-26-6C-24 6-10 8 0 0Z M0 2C-4 12-16 22-9 9C-6 4-2 3 0 2Z" fill="url(#wingG)" stroke="#9cc4ff" stroke-width=".8"/></g>
        <g class="wingR"><path d="M0 0C8-20 30-26 26-6C24 6 10 8 0 0Z M0 2C4 12 16 22 9 9C6 4 2 3 0 2Z" fill="url(#wingG)" stroke="#9cc4ff" stroke-width=".8"/></g>
        <ellipse cx="0" cy="1" rx="1.8" ry="9" fill="#e8f4ff"/>
      </g>

      <g>
        <ellipse class="petalFall" cx="200" cy="0" rx="6" ry="9" fill="#7ab8ff" opacity=".8"/>
        <ellipse class="petalFall" cx="340" cy="0" rx="5" ry="8" fill="#a8d0ff" opacity=".8" style="animation-delay:-3s"/>
        <ellipse class="petalFall" cx="480" cy="0" rx="6" ry="9" fill="#6fa8ff" opacity=".8" style="animation-delay:-6s"/>
        <ellipse class="petalFall" cx="600" cy="0" rx="5" ry="8" fill="#b8d4ff" opacity=".8" style="animation-delay:-2s"/>
        <ellipse class="petalFall" cx="280" cy="0" rx="4" ry="7" fill="#e6f2ff" opacity=".8" style="animation-delay:-8s"/>
        <ellipse class="petalFall" cx="520" cy="0" rx="5" ry="8" fill="#7ab8ff" opacity=".8" style="animation-delay:-5s"/>
        <ellipse class="petalFall" cx="420" cy="0" rx="4" ry="7" fill="#a8d0ff" opacity=".8" style="animation-delay:-9s"/>
      </g>
    </svg>
  </div>
</div>

<script>
  
  (function () {
    const sky = document.getElementById('sky');
    let h = '';
    for (let i = 0; i < 90; i++) {
      const s = (Math.random() * 1.8 + 0.8).toFixed(1);
      h += `<i class="s" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;--t:${(2.5+Math.random()*4).toFixed(1)}s;animation-delay:${(-Math.random()*6).toFixed(1)}s"></i>`;
    }
    for (let i = 0; i < 8; i++) {
      const s = Math.round(50 + Math.random() * 90);
      h += `<i class="bk" style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;--t:${Math.round(22+Math.random()*18)}s;animation-delay:${-Math.round(Math.random()*30)}s"></i>`;
    }
    sky.innerHTML = h;
  })();

  (function () {
    const round1 = n => Math.round(n * 10) / 10;
    let seed = 7;
    const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const palettes = {
      cobalt: ['#0b2273', '#2b5fe0', '#86b6ff'],
      ice:    ['#2f63c9', '#88b7ff', '#eaf4ff'],
      white:  ['#8ea9d8', '#e1ecff', '#ffffff'],
      peri:   ['#3f3597', '#847bec', '#d9d4ff'],
      gold:   ['#c97d00', '#ffc53a', '#fff2b8'],
      sage:   ['#14524c', '#2f9486', '#9fe0d0']
    };
    let defs = '';
    for (const k in palettes) {
      const p = palettes[k];
      defs += `<linearGradient id="p-${k}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p[0]}"/><stop offset=".55" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient>`;
    }
    document.getElementById('paldefs').innerHTML = defs;
    function petalPath(L, W) {
      const p = (a, b) => `${round1(a * W)} ${round1(b * L)}`;
      return `M0 0C${p(-.62,-.08)} ${p(-.8,-.7)} ${p(-.34,-.94)}C${p(-.14,-1.05)} ${p(.14,-1.05)} ${p(.34,-.94)}C${p(.8,-.7)} ${p(.62,-.08)} 0 0Z`;
    }
    function petalRing(n, L, W, off, pal, lift) {
      let s = '';
      const d = petalPath(L, W);
      for (let i = 0; i < n; i++) {
        const a = off + i * 360 / n;
        s += `<path d="${d}" transform="rotate(${round1(a)}) translate(0 ${round1(-(lift || 0))})" fill="url(#p-${pal})" stroke="rgba(6,14,64,.38)" stroke-width=".6"/>`;
      }
      return s;
    }
    function placeFlower(x, y, i, inner) {
      return `<g class="fl" style="--d:${(2.4 + i * 0.055).toFixed(2)}s"><g transform="translate(${x} ${y})">${inner}</g></g>`;
    }
    const softShadow = R => `<ellipse cx="0" cy="${round1(R*.08)}" rx="${round1(R*1.02)}" ry="${round1(R)}" fill="rgba(4,8,44,.38)"/>`;

    function rose(x, y, R, pal, rot, i) {
      const body =
        petalRing(7, R,     R * .5,  rot,      pal, R * .02) +
        petalRing(6, R * .8, R * .46, rot + 25, pal, R * .02) +
        petalRing(5, R * .58, R * .42, rot + 11, pal, 0) +
        petalRing(4, R * .38, R * .36, rot + 40, pal, 0) +
        `<circle r="${round1(R*.1)}" fill="url(#p-${pal})" stroke="rgba(6,14,64,.4)" stroke-width=".6"/>`;
      return placeFlower(x, y, i, softShadow(R) + `<g class="br" style="animation-delay:${(-i*.6).toFixed(1)}s">${body}</g>`);
    }
    function daisy(x, y, R, pal, center, i) {
      const body = petalRing(14, R, R * .2, 0, pal, 0) +
        `<circle r="${round1(R*.26)}" fill="${center}" stroke="rgba(60,30,0,.45)" stroke-width=".8"/>` +
        `<circle cx="${round1(-R*.07)}" cy="${round1(-R*.08)}" r="${round1(R*.08)}" fill="rgba(255,255,255,.55)"/>`;
      return placeFlower(x, y, i, softShadow(R * .9) + `<g class="br" style="animation-delay:${(-i*.6).toFixed(1)}s">${body}</g>`);
    }
    function hydrangea(x, y, R, pals, i) {
      let s = '';
      const N = 16;
      for (let k = N - 1; k >= 0; k--) {
        const rr = R * Math.sqrt((k + .5) / N) * .92, a = k * 2.39996;
        const pal = pals[k % pals.length];
        s += `<g transform="translate(${round1(rr*Math.cos(a))} ${round1(rr*Math.sin(a))}) rotate(${(k*37)%90})">${petalRing(4, R*.32, R*.28, 0, pal, 0)}<circle r="${round1(R*.045)}" fill="#fff" opacity=".85"/></g>`;
      }
      return placeFlower(x, y, i, softShadow(R) + `<g class="br" style="animation-delay:${(-i*.6).toFixed(1)}s">${s}</g>`);
    }
    const curvePoint = (P0, C, P1, t) => { const u = 1 - t; return [u*u*P0[0] + 2*u*t*C[0] + t*t*P1[0], u*u*P0[1] + 2*u*t*C[1] + t*t*P1[1]]; };
    const curveTangent = (P0, C, P1, t) => { const u = 1 - t; return [2*u*(C[0]-P0[0]) + 2*t*(P1[0]-C[0]), 2*u*(C[1]-P0[1]) + 2*t*(P1[1]-C[1])]; };

    function leafSpray(ex, ey, bend, n) {
      const P0 = [400, 640], P1 = [ex, ey], C = [(400 + ex) / 2 + bend, (640 + ey) / 2];
      let s = `<path d="M400 640Q${round1(C[0])} ${round1(C[1])} ${ex} ${ey}" fill="none" stroke="#1d6d64" stroke-width="3.2" stroke-linecap="round"/>`;
      for (let j = 0; j < n; j++) {
        const t = .38 + .62 * j / (n - 1);
        const [x, y] = curvePoint(P0, C, P1, t), [dx, dy] = curveTangent(P0, C, P1, t);
        const th = Math.atan2(dy, dx) * 180 / Math.PI + 90;
        const side = j % 2 ? 1 : -1, L = 48 - j * 2.2;
        s += `<path d="${petalPath(L, L*.62)}" transform="translate(${round1(x)} ${round1(y)}) rotate(${round1(th + side*52)})" fill="url(#p-sage)" stroke="rgba(6,40,36,.5)" stroke-width=".6"/>`;
      }
      const [tx, ty] = curveTangent(P0, C, P1, 1), tth = Math.atan2(ty, tx) * 180 / Math.PI + 90;
      s += `<path d="${petalPath(30, 19)}" transform="translate(${ex} ${ey}) rotate(${round1(tth)})" fill="url(#p-sage)" stroke="rgba(6,40,36,.5)" stroke-width=".6"/>`;
      return s;
    }
    function babysBreathSpray(ex, ey, bend) {
      const C = [(400 + ex) / 2 + bend, (640 + ey) / 2];
      let s = `<path d="M400 640Q${round1(C[0])} ${round1(C[1])} ${ex} ${ey}" fill="none" stroke="rgba(170,215,200,.55)" stroke-width="1.4"/>`;
      for (let k = 0; k < 9; k++) {
        const a = rand() * Math.PI * 2, r = 4 + rand() * 26;
        const x = ex + Math.cos(a) * r, y = ey + Math.sin(a) * r, rr = 1.6 + rand() * 2.2;
        s += `<path d="M${ex} ${ey}L${round1(x)} ${round1(y)}" stroke="rgba(170,215,200,.5)" stroke-width=".8"/><circle cx="${round1(x)}" cy="${round1(y)}" r="${round1(rr)}" fill="#fff" opacity=".92"/>`;
      }
      return s;
    }

    const flowerList = [
      ['rose',  386, 210, 26, 'cobalt', 10],
      ['rose',  432, 216, 24, 'white', 30],
      ['hydrangea',   336, 238, 50, ['peri', 'ice', 'cobalt', 'white']],
      ['hydrangea',   464, 236, 50, ['ice', 'peri', 'white', 'cobalt']],
      ['rose',  400, 270, 56, 'cobalt', 0],
      ['rose',  288, 318, 54, 'white', 14],
      ['rose',  512, 320, 54, 'ice', 20],
      ['rose',  236, 384, 48, 'peri', 8],
      ['rose',  566, 386, 48, 'white', 33],
      ['rose',  350, 344, 60, 'ice', 5],
      ['rose',  450, 346, 60, 'peri', 18],
      ['daisy', 206, 450, 32, 'gold', '#7a3b00'],
      ['daisy', 594, 452, 32, 'gold', '#7a3b00'],
      ['rose',  298, 420, 58, 'white', 12],
      ['rose',  502, 422, 58, 'ice', 27],
      ['rose',  400, 410, 72, 'cobalt', 0],
      ['rose',  252, 478, 44, 'cobalt', 5],
      ['rose',  548, 480, 44, 'peri', 22],
      ['rose',  342, 482, 46, 'peri', 15],
      ['rose',  458, 484, 46, 'white', 9],
      ['daisy', 400, 488, 34, 'white', 'url(#p-gold)']
    ];
    let flowers = '', stems = '';
    flowerList.forEach((d, i) => {
      if (d[0] === 'rose') flowers += rose(d[1], d[2], d[3], d[4], d[5], i);
      else if (d[0] === 'daisy') flowers += daisy(d[1], d[2], d[3], d[4], d[5], i);
      else flowers += hydrangea(d[1], d[2], d[3], d[4], i);
      if (d[3] > 32) stems += `<path d="M400 650Q${round1((400+d[1])/2)} ${round1((650+d[2])/2+24)} ${d[1]} ${d[2]}" fill="none" stroke="#1d6d64" stroke-width="4.5" stroke-linecap="round"/>`;
    });
    document.getElementById('flowers').innerHTML = flowers;
    document.getElementById('stems').innerHTML = stems;

    const leafSprays = [[170,430,-30],[190,340,-34],[250,250,-24],[330,186,-14],[470,184,14],[552,248,24],[612,340,34],[632,432,30]];
    document.getElementById('leaves').innerHTML = leafSprays.map(a => leafSpray(a[0], a[1], a[2], 7)).join('');
    const babysBreathSprays = [[150,382,-30],[176,290,-30],[232,208,-22],[312,152,-12],[400,140,0],[490,152,12],[570,208,22],[626,290,30],[652,382,30]];
    document.getElementById('babys-breath').innerHTML = babysBreathSprays.map(a => babysBreathSpray(a[0], a[1], a[2])).join('');

    const starShape = 'M0 -10L2.4 -2.4L10 0L2.4 2.4L0 10L-2.4 2.4L-10 0L-2.4 -2.4Z';
    const sparklePoints = [[200,300,1],[300,160,.8],[500,170,.9],[610,300,1.1],[150,470,.8],[660,470,.8],[250,600,.7],[560,580,.7],[400,120,.9],[350,500,.6],[460,520,.6]];
    document.getElementById('sparks').innerHTML = sparklePoints.map((s, i) =>
      `<g transform="translate(${s[0]} ${s[1]}) scale(${s[2]})"><path class="spark" d="${starShape}" fill="#fff" style="animation-delay:${(-i*.9).toFixed(1)}s"/></g>`).join('');
    const fireflyPoints = [[180,380],[620,420],[280,300],[540,320],[380,500],[460,560]];
    document.getElementById('flies').innerHTML = fireflyPoints.map((s, i) =>
      `<circle class="firefly" cx="${s[0]}" cy="${s[1]}" r="9" fill="url(#glowG)" style="animation-delay:${(-i*1.7).toFixed(1)}s"/>`).join('');
  })();

  const scene = document.getElementById('scene');
  const gift = document.getElementById('gift');
  let opened = false;
  function openGift() {
    if (opened) return;
    opened = true;
    scene.classList.add('opening');
    playChime();
  }
  gift.addEventListener('click', openGift);
  gift.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });

  function playChime() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      const start = ctx.currentTime;
      notes.forEach((freq, i) => {
        [['sine', 1, .11], ['triangle', 2, .03]].forEach(([type, mult, vol]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq * mult;
          const t = start + i * 0.16;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(vol, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 1.9);
        });
      });
    } catch (e) {}
  }
</script>

</body>
